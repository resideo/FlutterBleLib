group 'com.polidea.flutter_ble_lib'
version '2.3.2'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url "https://jitpack.io" }
        maven {
            url = 'https://maven.pkg.github.com/resideo/MultiPlatformBleAdapter'
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: System.getenv('GITHUB_USER')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 35
    namespace "com.resideo.flutter_ble_lib"

    defaultConfig {
        minSdkVersion 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'com.github.resideo:multiplatformbleadapter:1.0.5'
}
